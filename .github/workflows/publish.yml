name: Publish to GitHub Packages

# - Release published (tag v1.2.3 or 1.2.3) -> version 1.2.3
# - Manual run (Actions tab / `gh workflow run publish.yml`) -> version 1.0-SNAPSHOT
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="1.0-SNAPSHOT"
          fi
          echo "Publishing version $VERSION"
          ./gradlew build publishAllPublicationsToGitHubPackagesRepository -PvelVersion="$VERSION"
