plugins {
    id 'org.jetbrains.kotlin.jvm'
}

dependencies {
    implementation project(':vel-core')
    implementation 'com.google.devtools.ksp:symbol-processing-api:2.3.14'

    testImplementation project(':vel-runtime')
    testImplementation 'dev.zacsweers.kctfork:ksp:0.14.0'
    // kctfork brings KSP 2.3.12; keep its implementation in step with the 2.3.14 API above
    testImplementation 'com.google.devtools.ksp:symbol-processing:2.3.14'
    testImplementation 'com.google.devtools.ksp:symbol-processing-common-deps:2.3.14'
    testImplementation 'com.google.devtools.ksp:symbol-processing-aa-embeddable:2.3.14'
}
